<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts for text drawn into images (local cover cards, VK previews). The Railway image has no fonts at all,
     so SVG text came out as empty boxes. DejaVu covers Latin and Cyrillic. Loaded via FONTCONFIG_FILE (server.js). -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/nf-fontconfig-cache</cachedir>
  <alias><family>Arial</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
