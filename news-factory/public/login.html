<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4fbff">
<title>News Factory — вход</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--text:#0b1735;--muted:#667797;--line:rgba(74,130,186,.18);--blue:#168cff;--cyan:#20d4dc;--violet:#665cff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#f4fbff;color:var(--text);font-family:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{
  min-height:100vh;display:grid;place-items:center;padding:24px;
  background:
    radial-gradient(circle at 18% 8%,rgba(32,212,220,.18),transparent 29%),
    radial-gradient(circle at 88% 20%,rgba(22,140,255,.14),transparent 31%),
    radial-gradient(circle at 77% 90%,rgba(102,92,255,.045),transparent 24%),
    linear-gradient(145deg,#fbfeff,#eef9ff 48%,#f7fbff);
}
.wrap{width:min(440px,100%)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.mark{
  width:60px;height:60px;border-radius:19px;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:24px;
  background:linear-gradient(135deg,#27ddd9 0%,#159bff 62%,#655cff 100%);
  box-shadow:0 14px 34px rgba(22,140,255,.22),0 4px 12px rgba(32,212,220,.15)
}
.brand h1{margin:0;font-size:29px;font-weight:800;letter-spacing:-.035em}
.brand p{margin:4px 0 0;color:var(--muted);font-size:14px}
.card{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 100% 0%,rgba(32,212,220,.15),transparent 34%),
    radial-gradient(circle at 100% 100%,rgba(22,140,255,.10),transparent 34%),
    linear-gradient(145deg,rgba(255,255,255,.94),rgba(245,251,255,.84));
  border:1px solid rgba(74,130,186,.16);border-radius:26px;padding:24px;
  box-shadow:0 28px 80px rgba(41,91,134,.13),inset 0 1px 0 rgba(255,255,255,.96);
  backdrop-filter:blur(22px) saturate(1.12);-webkit-backdrop-filter:blur(22px) saturate(1.12)
}
.title{font-size:21px;font-weight:750;letter-spacing:-.025em;margin-bottom:6px}
.muted{color:var(--muted);font-size:14px;margin-bottom:18px;line-height:1.5}
input{
  width:100%;border:1px solid rgba(74,130,186,.20);background:rgba(255,255,255,.86);color:var(--text);
  border-radius:15px;padding:15px 16px;font-size:16px;outline:none;font-family:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9)
}
input:focus{border-color:rgba(22,140,255,.48);box-shadow:0 0 0 4px rgba(22,140,255,.09)}
input::placeholder{color:#8a99b2}
button{
  width:100%;margin-top:11px;border:1px solid rgba(20,160,222,.18);border-radius:15px;padding:15px;
  color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;
  background:linear-gradient(100deg,#20d4dc 0%,#168cff 76%,#5f63ee 112%);
  box-shadow:0 10px 26px rgba(22,140,255,.20),inset 0 1px 0 rgba(255,255,255,.28)
}
button:active{transform:scale(.99)}
.err{color:#d84956;font-size:13px;min-height:19px;margin-top:10px}
.foot{color:#72829d;font-size:12px;text-align:center;margin-top:14px}
@media(max-width:520px){body{padding:18px}.brand h1{font-size:26px}.card{padding:20px;border-radius:22px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">AI</div><div><h1>News Factory</h1><p>AI Pulse · редакторская панель</p></div></div>
  <div class="card">
    <div class="title">Вход в систему</div>
    <div class="muted">Управление источниками, очередью и публикациями Telegram из одного места.</div>
    <form id="loginForm">
      <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" autofocus>
      <button type="submit">Войти</button>
      <div id="error" class="err"></div>
    </form>
  </div>
  <div class="foot">News Factory · private admin · <span id="appVersion">v—</span></div>
</div>
<script>
fetch('/health',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(j&&j.version)document.getElementById('appVersion').textContent='v'+j.version}).catch(function(){});
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var password=document.getElementById('password').value;
  var error=document.getElementById('error');
  error.textContent='';
  try{
    var r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:password})});
    if(!r.ok){error.textContent='Неверный пароль';return;}
    location.href='/admin';
  }catch(err){error.textContent='Ошибка соединения';}
});
</script>
</body>
</html>
