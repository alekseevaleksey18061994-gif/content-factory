<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090e">
<title>News Factory — вход</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07090e;color:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 30% 0%,rgba(62,89,255,.18),transparent 38%),radial-gradient(circle at 90% 30%,rgba(164,68,255,.13),transparent 36%),#07090e}
.wrap{width:min(440px,100%)}.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}.mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-weight:900;font-size:24px;background:linear-gradient(135deg,#22c7ff,#655cff 55%,#b24cff);box-shadow:0 16px 40px rgba(67,92,255,.28)}.brand h1{margin:0;font-size:28px}.brand p{margin:3px 0 0;color:#8e98aa;font-size:14px}
.card{background:rgba(17,21,29,.92);border:1px solid #242b39;border-radius:24px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.45);backdrop-filter:blur(14px)}.title{font-size:20px;font-weight:750;margin-bottom:6px}.muted{color:#8f99aa;font-size:14px;margin-bottom:18px;line-height:1.5}
input{width:100%;border:1px solid #303849;background:#0a0d13;color:white;border-radius:14px;padding:15px 16px;font-size:17px;outline:none}input:focus{border-color:#648dff;box-shadow:0 0 0 3px rgba(100,141,255,.1)}button{width:100%;margin-top:11px;border:0;border-radius:14px;padding:15px;background:#f6f7fb;color:#0a0c10;font-size:16px;font-weight:800;cursor:pointer}.err{color:#ff7e7e;font-size:13px;min-height:19px;margin-top:10px}.foot{color:#6f7888;font-size:12px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">AI</div><div><h1>News Factory</h1><p>AI Pulse · редакторская панель</p></div></div>
  <div class="card">
    <div class="title">Вход в систему</div>
    <div class="muted">Управление источниками, очередью и публикациями Telegram из одного места.</div>
    <form id="loginForm">
      <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" autofocus>
      <button type="submit">Войти</button>
      <div id="error" class="err"></div>
    </form>
  </div>
  <div class="foot">News Factory · private admin · <span id="appVersion">v—</span></div>
</div>
<script>
fetch('/health',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(j&&j.version)document.getElementById('appVersion').textContent='v'+j.version}).catch(function(){});
document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var password=document.getElementById('password').value;
  var error=document.getElementById('error');
  error.textContent='';
  try{
    var r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:password})});
    if(!r.ok){error.textContent='Неверный пароль';return;}
    location.href='/admin';
  }catch(err){error.textContent='Ошибка соединения';}
});
</script>
</body>
</html>
