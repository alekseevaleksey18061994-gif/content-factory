<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-label="Два дружелюбных ИИ-робота News Factory">
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#ebfcff"/><stop offset=".73" stop-color="#6baefa"/><stop offset="1" stop-color="#1a4aab"/></linearGradient>
 <linearGradient id="shell2" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff"/><stop offset=".55" stop-color="#cceeff"/><stop offset="1" stop-color="#3b78df"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#09295f"/><stop offset="1" stop-color="#03132e"/></linearGradient>
