 <linearGradient id="laptop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9cf5ff"/><stop offset=".45" stop-color="#2483d5"/><stop offset="1" stop-color="#103c87"/></linearGradient>
 <radialGradient id="shine"><stop stop-color="#12efff" stop-opacity=".75"/><stop offset="1" stop-color="#12efff" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
 <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#001c4c" flood-opacity=".52"/></filter>
</defs>
