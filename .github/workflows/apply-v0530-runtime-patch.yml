name: Apply approved auto-shopping runtime patch

on:
  push:
    branches: [auto-shopping-approved-20261005]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref_name == 'auto-shopping-approved-20261005' || github.head_ref == 'auto-shopping-approved-20261005'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-shopping-approved-20261005
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply runtime patch
        run: python news-factory/scripts/apply-v0530-runtime-patch.py
      - name: Validate syntax
        run: node --check news-factory/server.js
      - name: Commit patched runtime
        run: |
          rm -f news-factory/scripts/apply-v0530-runtime-patch.py
          rm -f .github/workflows/apply-v0530-runtime-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-factory/server.js news-factory/scripts/apply-v0530-runtime-patch.py .github/workflows/apply-v0530-runtime-patch.yml
          git commit -m "feat: wire approved auto and shopping runtime"
          git push origin HEAD:auto-shopping-approved-20261005
